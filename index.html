<!DOCTYPE html>
<html lang="es">

<head>

    <title>Confirmación ❤️</title>
    <link rel="stylesheet" href="./Styles.css">
</head>

            <div class="buttons">

    <div class="hearts"></div>

    <script src="./confirmacion.js"></script>

</html>
